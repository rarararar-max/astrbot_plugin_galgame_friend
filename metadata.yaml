name: astrbot_plugin_galgame_friend
display_name: 好友 Galgame
short_desc: 把 QQ 私聊好友变成 galgame：立绘、情绪表情、AI 候选台词与好感度
desc: >-
  把已绑定的 QQ 私聊好友变成 galgame 场景：好友发来消息时，页面上会出现立绘、
  对话框和三条 AI 生成的回复候选；每条候选带不同的策略角度与好感度增减，
  点一条就直接发给对方。支持共享的角色/背景素材库、按情绪标签自动切换立绘、
  好感度上限 100、过往聊天记录浮窗。自带一套示例立绘与背景，装完即可使用。
version: 1.0.0
